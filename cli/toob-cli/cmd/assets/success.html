<!DOCTYPE html>
<html>
<head>
    <title>Toob Registry - Login Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-grid: rgba(0, 0, 0, 0.03);
            --card-bg: #ffffff;
            --card-border: #000000;
            --card-shadow: #000000;
            --text-main: #000000;
            --text-muted: #555555;
            --logo-letter-text: #000000;
            --logo-toggle-bg: #C0FFCC;
            --logo-toggle-border-line: #010101;
            --logo-slider-line: #000000;
            --logo-knob-circle: #010101;
            --logo-knob-face: #000000;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #050505;
                --bg-grid: rgba(255, 255, 255, 0.02);
                --card-bg: #0d0d0d;
                --card-border: #C0FFCC;
                --card-shadow: #ffffff;
                --text-main: #ffffff;
                --text-muted: #a0a0a0;
                --logo-letter-text: #ffffff;
                --logo-toggle-bg: transparent;
                --logo-toggle-border-line: #C0FFCC;
                --logo-slider-line: #C0FFCC;
                --logo-knob-circle: #ffffff;
                --logo-knob-face: #ffffff;
            }
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            padding: 48px;
            border-radius: 8px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 8px 8px 0px var(--card-shadow);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .logo-container {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
        }
        .toob-logo .letter-text {
            fill: var(--logo-letter-text);
            transition: fill 0.3s;
        }
        .toob-logo .toggle-bg {
            fill: var(--logo-toggle-bg);
            transition: fill 0.3s;
        }
        .toob-logo .toggle-border-line {
            stroke: var(--logo-toggle-border-line);
            transition: stroke 0.3s;
        }
        .toob-logo .slider-line {
            fill: var(--logo-slider-line);
            transform: scaleX(0);
            transform-origin: 19.25px 50%;
            transition: fill 0.3s, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toob-logo .knob-circle {
            stroke: var(--logo-knob-circle);
            fill: var(--card-bg);
            transition: stroke 0.3s, fill 0.3s;
        }
        .toob-logo .knob-face {
            fill: var(--logo-knob-face);
            transition: fill 0.3s;
        }

        h1 {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 16px 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
            transition: color 0.3s;
        }
        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            font-weight: 300;
            transition: color 0.3s;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <svg class="toob-logo" width="171" height="60" viewBox="0 0 57 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path class="letter-text" d="M49.8 0.539999C51.2533 0.539999 52.3933 0.839999 53.22 1.44C54.06 2.02667 54.48 2.94667 54.48 4.2C54.48 4.96 54.3067 5.62 53.96 6.18C53.6133 6.74 53.1267 7.18 52.5 7.5C51.8867 7.82 51.16 8 50.32 8.04L50.04 7.04C51.0133 7.06667 51.8867 7.24 52.66 7.56C53.4333 7.88 54.0467 8.32667 54.5 8.9C54.9533 9.47333 55.18 10.1533 55.18 10.94C55.18 11.66 55.0467 12.28 54.78 12.8C54.5133 13.3067 54.1533 13.7267 53.7 14.06C53.2467 14.38 52.7333 14.62 52.16 14.78C51.5867 14.9267 50.9933 15 50.38 15H46.08V0.539999H49.8ZM50.2 6.88C51 6.88 51.58 6.66 51.94 6.22C52.3 5.76667 52.48 5.22 52.48 4.58C52.48 3.82 52.2467 3.26667 51.78 2.92C51.3133 2.57333 50.6867 2.4 49.9 2.4H48.02V6.88H50.2ZM50.28 13.2C50.8133 13.2 51.3 13.12 51.74 12.96C52.1933 12.8 52.5467 12.5533 52.8 12.22C53.0667 11.8867 53.2 11.4667 53.2 10.96C53.2 10.4 53.0467 9.96 52.74 9.64C52.4467 9.32 52.0667 9.09333 51.6 8.96C51.1333 8.81333 50.6533 8.74 50.16 8.74H48.02V13.2H50.28Z"/>
                <path class="letter-text" d="M1.02 0.539999H10.62V2.4H6.74V15H4.8V2.4H1.02V0.539999Z"/>
                <rect class="toggle-bg" x="17" y="2" width="13" height="12"/>
                <rect class="toggle-bg" x="14" y="3" width="3" height="9"/>
                <rect class="toggle-bg" x="15" y="4" width="3" height="9"/>
                <rect class="toggle-bg" x="29" y="2" width="3" height="2"/>
                <rect class="toggle-bg" x="29" y="12" width="3" height="2"/>
                <rect class="toggle-bg" x="28" y="11" width="3" height="2"/>
                <rect class="slider-line" x="19.25" y="13" width="17" height="2"/>
                <rect class="slider-line" x="19.25" y="0.5" width="17" height="2"/>
                <path class="toggle-border-line" d="M19.25 1.5C15.7982 1.5 13 4.29822 13 7.75C13 11.2018 15.7982 14 19.25 14" stroke-width="2"/>
                
                <g class="knob-group" style="transform: translate(-16.75px, 0); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
                    <circle class="knob-circle" cx="36" cy="7.75" r="6.25" transform="rotate(-180 36 7.75)" stroke-width="2"/>
                    
                    <g class="knob-smiley" style="opacity: 0; transition: opacity 0.25s ease-in-out;">
                        <rect class="knob-face" x="34" y="5" width="1" height="1"/>
                        <rect class="knob-face" x="37" y="5" width="1" height="1"/>
                        <rect class="knob-face" x="33" y="8" width="1" height="1"/>
                        <rect class="knob-face" x="34" y="9" width="1" height="1"/>
                        <rect class="knob-face" x="35" y="9" width="1" height="1"/>
                        <rect class="knob-face" x="36" y="9" width="1" height="1"/>
                        <rect class="knob-face" x="37" y="9" width="1" height="1"/>
                        <rect class="knob-face" x="38" y="8" width="1" height="1"/>
                    </g>
                    
                    <g class="knob-checkmark" style="opacity: 1; transition: opacity 0.25s ease-in-out;">
                        <rect class="knob-face" x="33" y="7" width="1" height="1"/>
                        <rect class="knob-face" x="34" y="8" width="1" height="1"/>
                        <rect class="knob-face" x="35" y="9" width="1" height="1"/>
                        <rect class="knob-face" x="36" y="8" width="1" height="1"/>
                        <rect class="knob-face" x="37" y="7" width="1" height="1"/>
                        <rect class="knob-face" x="38" y="6" width="1" height="1"/>
                    </g>
                </g>
            </svg>
        </div>
        
        <h1>Login Successful</h1>
        <p>Your Toob CLI is now fully authenticated. You can safely close this browser window and return to your terminal.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const knobGroup = document.querySelector(".knob-group");
            const knobSmiley = document.querySelector(".knob-smiley");
            const knobCheckmark = document.querySelector(".knob-checkmark");
            
            // 1. Slide toggle right
            setTimeout(() => {
                knobGroup.style.transform = "translate(0, 0)";
                document.querySelectorAll(".toob-logo .slider-line").forEach(line => {
                    line.style.transform = "scaleX(1)";
                });
            }, 200);
            
            // 2. Initial swap from checkmark to smiley after slide completes
            setTimeout(() => {
                knobCheckmark.style.opacity = "0";
                knobSmiley.style.opacity = "1";
            }, 1400);
            
            // 3. Repeat loop every 5 seconds (checkmark for 2s, smiley for 3s)
            setInterval(() => {
                // Fade to checkmark
                knobSmiley.style.opacity = "0";
                knobCheckmark.style.opacity = "1";
                
                // After 2 seconds, fade back to smiley
                setTimeout(() => {
                    knobCheckmark.style.opacity = "0";
                    knobSmiley.style.opacity = "1";
                }, 2000);
            }, 5000);
        });
    </script>
</body>
</html>
