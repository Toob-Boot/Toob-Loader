name: Compiler Promote Pipeline

# Triggered when a compiler draft release is published (manual approval gate).
# Promotes the RC image on Docker Hub to the final version tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  promote:
    name: Promote Compiler Image
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'compiler/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.RELEASE_TARGET_TOKEN }}

      - name: Extract Version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          RAW_VERSION=${TAG#compiler/v}
          REPOSITORY=$(jq -r '.distribution.repository' compiler/compiler_manifest.json)
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_ENV
          echo "REPOSITORY=$REPOSITORY" >> $GITHUB_ENV
          echo ">>> Promoting ${REPOSITORY}:v${RAW_VERSION}-rc → v${RAW_VERSION} + latest"

      - name: Login to Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "FATAL: DOCKERHUB_TOKEN secret not configured. Add it in GitHub repo settings."
            exit 1
          fi
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Promote RC to Final
        run: |
          RC_TAG="${REPOSITORY}:v${RAW_VERSION}-rc"
          FINAL_TAG="${REPOSITORY}:v${RAW_VERSION}"
          LATEST_TAG="${REPOSITORY}:latest"

          echo ">>> Pulling RC image..."
          docker pull "${RC_TAG}"

          echo ">>> Retagging..."
          docker tag "${RC_TAG}" "${FINAL_TAG}"
          docker tag "${RC_TAG}" "${LATEST_TAG}"

          echo ">>> Pushing final tags..."
          docker push "${FINAL_TAG}"
          docker push "${LATEST_TAG}"

          echo ">>> [SUCCESS] ${FINAL_TAG} and ${LATEST_TAG} pushed to Docker Hub"

      - name: Update Manifest Version
        run: |
          CURRENT=$(jq -r '.compiler_version' compiler/compiler_manifest.json)
          if [ "$CURRENT" = "$RAW_VERSION" ]; then
            echo ">>> Manifest already at v${RAW_VERSION}. Skipping."
            exit 0
          fi

          jq --arg v "$RAW_VERSION" '.compiler_version = $v' \
            compiler/compiler_manifest.json > tmp_manifest.json \
            && mv tmp_manifest.json compiler/compiler_manifest.json

          git config user.name "Toob Release Bot"
          git config user.email "release@toob-boot.io"
          git add compiler/compiler_manifest.json
          git commit -m "chore(compiler): record v${RAW_VERSION} release [skip ci]"
          git push origin HEAD:main

          echo ">>> [SUCCESS] Manifest updated to v${RAW_VERSION}"

      - name: Trigger Topology Update
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RELEASE_TARGET_TOKEN }}" \
            https://api.github.com/repos/Toob-Boot/Toob-Registry/actions/workflows/version-index.yml/dispatches \
            -d '{"ref":"main"}'
          echo ">>> Topology update triggered"

      - name: Clean Up RC Tag
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          REPO_PATH=$(echo "${REPOSITORY}" | sed 's|/|/repositories/|')
          curl -s -X DELETE \
            -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/${REPO_PATH}/tags/v${RAW_VERSION}-rc/" \
            && echo ">>> RC tag v${RAW_VERSION}-rc removed from Docker Hub" \
            || echo ">>> RC tag cleanup skipped (non-critical)"
