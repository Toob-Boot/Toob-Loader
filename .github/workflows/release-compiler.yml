name: Compiler Publisher Pipeline

on:
  push:
    tags:
      - "compiler/v*"

permissions:
  contents: write

jobs:
  build-and-stage:
    name: Build & Stage Compiler Image
    runs-on: ubuntu-latest
    if: ${{ github.event.act }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TARGET_TOKEN }}

      - name: Extract Versions
        run: |
          REF="${GITHUB_REF}"
          if [ -z "$REF" ] || [ "$REF" = "master" ] || [ "$REF" = "main" ]; then
            REF=$(jq -r '.ref // empty' "$GITHUB_EVENT_PATH")
          fi
          TAG_NAME=${REF#refs/tags/}
          RAW_VERSION=${TAG_NAME#compiler/v}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_ENV

          CLI_VERSION=$(jq -r '.cli.version' compiler/compiler_manifest.json)
          CLI_REF=$(jq -r '.cli.source.ref' compiler/compiler_manifest.json)
          PROTOCOL_VERSION=$(jq -r '.protocol_version' compiler/compiler_manifest.json)
          REPOSITORY=$(jq -r '.distribution.repository' compiler/compiler_manifest.json)

          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_ENV
          echo "CLI_REF=$CLI_REF" >> $GITHUB_ENV
          echo "PROTOCOL_VERSION=$PROTOCOL_VERSION" >> $GITHUB_ENV
          echo "REPOSITORY=$REPOSITORY" >> $GITHUB_ENV

          echo ">>> Compiler v${RAW_VERSION} | CLI v${CLI_VERSION} | Protocol v${PROTOCOL_VERSION}"

      - name: Build Docker Image
        working-directory: cli/.pipeline-repo
        run: |
          echo ">>> Building ${REPOSITORY}:v${RAW_VERSION}-rc..."

          docker build \
            --no-cache \
            --build-arg CLI_VERSION=${CLI_REF} \
            --build-arg COMPILER_VERSION=${RAW_VERSION} \
            --build-arg PROTOCOL_VERSION=${PROTOCOL_VERSION} \
            --label "org.opencontainers.image.version=${RAW_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/Toob-Boot/Toob-Loader" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.vendor=Toob-Boot" \
            --label "org.opencontainers.image.title=Toob Compiler" \
            --label "org.opencontainers.image.description=Cross-compilation environment for Toob-Loader firmware" \
            --label "toob.compiler_version=${RAW_VERSION}" \
            --label "toob.cli_version=${CLI_VERSION}" \
            --label "toob.protocol_version=${PROTOCOL_VERSION}" \
            -t "${REPOSITORY}:v${RAW_VERSION}-rc" \
            -f Dockerfile.compiler .

          echo ">>> [SUCCESS] Image built: ${REPOSITORY}:v${RAW_VERSION}-rc"

      - name: Verify Protocol Label
        run: |
          LABEL=$(docker inspect --format '{{index .Config.Labels "toob.protocol_version"}}' "${REPOSITORY}:v${RAW_VERSION}-rc")
          if [ "$LABEL" != "$PROTOCOL_VERSION" ]; then
            echo "FATAL: Protocol label mismatch. Expected ${PROTOCOL_VERSION}, got ${LABEL}"
            exit 1
          fi
          echo ">>> Protocol label verified: v${LABEL}"

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Release Candidate
        run: |
          echo ">>> Pushing ${REPOSITORY}:v${RAW_VERSION}-rc..."
          docker push "${REPOSITORY}:v${RAW_VERSION}-rc"
          echo ">>> [SUCCESS] RC image pushed to Docker Hub"

      - name: Create Draft Release
        run: |
          BODY="## Compiler v${RAW_VERSION}\n\n"
          BODY+="| Property | Value |\n|---|---|\n"
          BODY+="| CLI | v${CLI_VERSION} |\n"
          BODY+="| Protocol | v${PROTOCOL_VERSION} |\n"
          BODY+="| Docker Hub | \`${REPOSITORY}:v${RAW_VERSION}-rc\` |\n\n"
          BODY+="**Publish this release to promote the image to \`v${RAW_VERSION}\` + \`latest\`.**"

          curl -sf -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RELEASE_TARGET_TOKEN }}" \
            https://api.github.com/repos/Toob-Boot/Toob-Loader/releases \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"Compiler v${RAW_VERSION}\",
              \"body\": \"$(echo -e "$BODY")\",
              \"draft\": true,
              \"prerelease\": false
            }"

          echo ">>> [SUCCESS] Draft release created for ${TAG_NAME}"
