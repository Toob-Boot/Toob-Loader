name: Compiler Publisher Pipeline

on:
  push:
    tags:
      - "compiler/v*"

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build & Push Compiler Image
    runs-on: ubuntu-latest
    if: ${{ github.event.act }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TARGET_TOKEN }}

      - name: Extract Versions
        run: |
          REF="${GITHUB_REF}"
          if [ -z "$REF" ] || [ "$REF" = "master" ] || [ "$REF" = "main" ]; then
            REF=$(jq -r '.ref // empty' "$GITHUB_EVENT_PATH")
          fi
          TAG_NAME=${REF#refs/tags/}
          RAW_VERSION=${TAG_NAME#compiler/v}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_ENV

          # Read pinned versions from the compiler manifest
          CLI_VERSION=$(jq -r '.cli.version' compiler/compiler_manifest.json)
          CLI_REF=$(jq -r '.cli.source.ref' compiler/compiler_manifest.json)
          PROTOCOL_VERSION=$(jq -r '.protocol_version' compiler/compiler_manifest.json)
          REPOSITORY=$(jq -r '.distribution.repository' compiler/compiler_manifest.json)

          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_ENV
          echo "CLI_REF=$CLI_REF" >> $GITHUB_ENV
          echo "PROTOCOL_VERSION=$PROTOCOL_VERSION" >> $GITHUB_ENV
          echo "REPOSITORY=$REPOSITORY" >> $GITHUB_ENV

          echo ">>> Compiler v${RAW_VERSION} | CLI v${CLI_VERSION} | Protocol v${PROTOCOL_VERSION}"

      - name: Build Docker Image
        working-directory: cli/.pipeline-repo
        run: |
          echo ">>> Building ${REPOSITORY}:v${RAW_VERSION}..."

          docker build \
            --no-cache \
            --build-arg CLI_VERSION=${CLI_REF} \
            --build-arg COMPILER_VERSION=${RAW_VERSION} \
            --build-arg PROTOCOL_VERSION=${PROTOCOL_VERSION} \
            --label "org.opencontainers.image.version=${RAW_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/Toob-Boot/Toob-Loader" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.vendor=Toob-Boot" \
            --label "org.opencontainers.image.title=Toob Compiler" \
            --label "org.opencontainers.image.description=Cross-compilation environment for Toob-Loader firmware" \
            --label "toob.compiler_version=${RAW_VERSION}" \
            --label "toob.cli_version=${CLI_VERSION}" \
            --label "toob.protocol_version=${PROTOCOL_VERSION}" \
            -t "${REPOSITORY}:v${RAW_VERSION}" \
            -t "${REPOSITORY}:latest" \
            -f Dockerfile.compiler .

          echo ">>> [SUCCESS] Image built: ${REPOSITORY}:v${RAW_VERSION}"

      - name: Verify Protocol Label
        run: |
          LABEL=$(docker inspect --format '{{index .Config.Labels "toob.protocol_version"}}' "${REPOSITORY}:v${RAW_VERSION}")
          if [ "$LABEL" != "$PROTOCOL_VERSION" ]; then
            echo "FATAL: Protocol label mismatch. Expected ${PROTOCOL_VERSION}, got ${LABEL}"
            exit 1
          fi
          echo ">>> Protocol label verified: v${LABEL}"

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        run: |
          echo ">>> Pushing ${REPOSITORY}:v${RAW_VERSION}..."
          docker push "${REPOSITORY}:v${RAW_VERSION}"
          docker push "${REPOSITORY}:latest"
          echo ">>> [SUCCESS] Image pushed to Docker Hub"

      - name: Update Manifest Version
        run: |
          CURRENT=$(jq -r '.compiler_version' compiler/compiler_manifest.json)
          if [ "$CURRENT" = "$RAW_VERSION" ]; then
            echo ">>> Manifest already at v${RAW_VERSION}. Skipping."
            exit 0
          fi

          echo ">>> Updating compiler_manifest.json: ${CURRENT} -> ${RAW_VERSION}"
          jq --arg v "$RAW_VERSION" '.compiler_version = $v' \
            compiler/compiler_manifest.json > tmp_manifest.json \
            && mv tmp_manifest.json compiler/compiler_manifest.json

          git config user.name "Toob Release Bot"
          git config user.email "release@toob-boot.io"
          git add compiler/compiler_manifest.json
          git commit -m "chore(compiler): record v${RAW_VERSION} release [skip ci]"
          git push origin HEAD:main || echo ">>> Push failed (non-critical). Manual sync needed."

      - name: Trigger Topology Update
        run: |
          echo ">>> Triggering version-index.yml in Toob-Boot/Toob-Registry..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RELEASE_TARGET_TOKEN }}" \
            https://api.github.com/repos/Toob-Boot/Toob-Registry/actions/workflows/version-index.yml/dispatches \
            -d '{"ref":"main"}'

