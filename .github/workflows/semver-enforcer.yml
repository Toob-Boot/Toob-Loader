name: ABI Oracle (SemVer Auto-Tagger)

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: abi-oracle
  cancel-in-progress: false

jobs:
  abi-oracle:
    name: Calculate ABI and Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TARGET_TOKEN }}

      - name: Setup Toob Ecosystem
        uses: ./.github/actions/setup-cli
        with:
          install-native-deps: "true"

      - name: Configure Git Identity
        run: |
          git config user.name "Toob ABI Oracle"
          git config user.email "oracle@toob-boot.io"

      - name: Detect Subsystem Changes
        id: changes
        run: |
          echo ">>> Detecting changes in recent commit..."

          git fetch --prune --unshallow 2>/dev/null || git fetch --all 2>/dev/null || true

          # Ensure the registry submodule is initialized
          if [ ! -d "toob-registry/.git" ] && [ ! -f "toob-registry/.git" ]; then
            git submodule update --init toob-registry
          fi

          # Check if a monorepo subsystem changed (direct files, not submodules).
          # Diffs from the last matching tag to capture accumulated changes.
          check_subsystem() {
            local tag_prefix=$1
            shift
            local paths=("$@")

            local last_tag=$(git describe --tags --match "${tag_prefix}v*" --abbrev=0 2>/dev/null || echo "")
            local diff_files=""

            if [ -n "$last_tag" ]; then
              diff_files=$(git diff --name-only "$last_tag" HEAD 2>/dev/null || echo "")
            else
              diff_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
              if [ -z "$diff_files" ]; then
                diff_files=$(git ls-files)
              fi
            fi

            for file in $diff_files; do
              for p in "${paths[@]}"; do
                if [[ "$file" == $p* ]]; then
                  echo "true"
                  return
                fi
              done
            done
            echo "false"
          }

          # Check if the toob-registry submodule has changes in a specific subdirectory.
          # Diffs from the submodule commit at the last matching tag (not HEAD~1)
          # to capture accumulated changes across multiple commits.
          check_registry_subsystem() {
            local subdir=$1
            local tag_prefix=$2

            local NEW_SUB=$(git rev-parse "HEAD:toob-registry" 2>/dev/null || echo "")
            [ -z "$NEW_SUB" ] && echo "false" && return

            local last_tag=$(git describe --tags --match "${tag_prefix}v*" --abbrev=0 2>/dev/null || echo "")
            local OLD_SUB=""

            if [ -n "$last_tag" ]; then
              OLD_SUB=$(git rev-parse "${last_tag}:toob-registry" 2>/dev/null || echo "")
            fi

            # If no previous tag or submodule commit differs, check for changes
            if [ -z "$OLD_SUB" ] || [ "$OLD_SUB" != "$NEW_SUB" ]; then
              local base_ref="${OLD_SUB:-$(cd toob-registry && git rev-list --max-parents=0 HEAD)}"
              local changes=$(cd toob-registry && git diff --name-only "$base_ref" "$NEW_SUB" -- "${subdir}/" 2>/dev/null || echo "")
              if [ -n "$changes" ]; then
                # Export these so Oracle steps don't rely on shifting HEAD
                local prefix=$(echo "$subdir" | tr '[:lower:]' '[:upper:]')
                echo "${prefix}_OLD_SUB=$base_ref" >> $GITHUB_ENV
                echo "${prefix}_NEW_SUB=$NEW_SUB" >> $GITHUB_ENV
                echo "true"
                return
              fi
            fi
            echo "false"
          }

          CHECK_CORE=$(check_subsystem "core/" "toobloader/core/" "sdk/" "common/")
          CHECK_CHIPS=$(check_registry_subsystem "chips" "chip-*/")
          CHECK_ARCH=$(check_registry_subsystem "arch" "arch-*/")
          CHECK_VENDORS=$(check_registry_subsystem "vendor" "vendor-*/")
          CHECK_TOOLCHAINS=$(check_registry_subsystem "toolchains" "toolchain-*/")
          CHECK_CLI=$(check_subsystem "cli/" "cli/toob-cli/")
          CHECK_COMPILER=$(check_subsystem "compiler/" "cli/.pipeline-repo/Dockerfile.compiler" "cli/.pipeline-repo/toob-ci-build.sh" "compiler/")

          # Dependency cascade: arch/vendor/toolchain changes MUST trigger chip evaluation
          # because chips depend on these layers via chip_manifest.json references.
          if [ "$CHECK_ARCH" = "true" ] || [ "$CHECK_VENDORS" = "true" ] || [ "$CHECK_TOOLCHAINS" = "true" ]; then
            if [ "$CHECK_CHIPS" != "true" ]; then
              CHECK_CHIPS="true"
              echo ">>> Cascade: dependency change triggers chip evaluation"
              # Ensure SUB refs are available for the Chips Oracle
              if [ -z "${CHIPS_OLD_SUB:-}" ]; then
                CHIPS_OLD_SUB=${ARCH_OLD_SUB:-${VENDOR_OLD_SUB:-${TOOLCHAINS_OLD_SUB:-}}}
                CHIPS_NEW_SUB=${ARCH_NEW_SUB:-${VENDOR_NEW_SUB:-${TOOLCHAINS_NEW_SUB:-}}}
                echo "CHIPS_OLD_SUB=$CHIPS_OLD_SUB" >> $GITHUB_ENV
                echo "CHIPS_NEW_SUB=$CHIPS_NEW_SUB" >> $GITHUB_ENV
              fi
            fi
          fi

          echo "CHECK_CORE=$CHECK_CORE" >> $GITHUB_ENV
          echo "CHECK_CHIPS=$CHECK_CHIPS" >> $GITHUB_ENV
          echo "CHECK_ARCH=$CHECK_ARCH" >> $GITHUB_ENV
          echo "CHECK_VENDORS=$CHECK_VENDORS" >> $GITHUB_ENV
          echo "CHECK_TOOLCHAINS=$CHECK_TOOLCHAINS" >> $GITHUB_ENV
          echo "CHECK_CLI=$CHECK_CLI" >> $GITHUB_ENV
          echo "CHECK_COMPILER=$CHECK_COMPILER" >> $GITHUB_ENV

          echo "Core changed: $CHECK_CORE"
          echo "Chips changed: $CHECK_CHIPS"
          echo "Arch changed: $CHECK_ARCH"
          echo "Vendors changed: $CHECK_VENDORS"
          echo "Toolchains changed: $CHECK_TOOLCHAINS"
          echo "CLI changed: $CHECK_CLI"
          echo "Compiler changed: $CHECK_COMPILER"

      - name: ABI Orakel (Core SDK)
        if: env.CHECK_CORE == 'true'
        run: |
          echo ">>> [Core Oracle] Starting symbol analysis for Core, SDK, and Common..."

          LAST_TAG=$(git describe --tags --match "core/v*" --abbrev=0 2>/dev/null || echo "core/v0.0.0")
          RAW_VERSION=${LAST_TAG#core/v}
          echo ">>> [Core Oracle] Baseline Tag: $LAST_TAG"

          MAJOR=$(echo $RAW_VERSION | cut -d. -f1)
          MINOR=$(echo $RAW_VERSION | cut -d. -f2)
          PATCH=$(echo $RAW_VERSION | cut -d. -f3)

          # If no real baseline exists, create the initial tag and skip diff
          if [ "$LAST_TAG" = "core/v0.0.0" ]; then
            echo ">>> [Core Oracle] No baseline tag. Creating initial patch release."
            PATCH=$((PATCH + 1))
            NEW_TAG="core/v${MAJOR}.${MINOR}.${PATCH}"

            if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [Core Oracle] Tag $NEW_TAG already exists. Skipping."
            else
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG" || echo ">>> Tag push failed (concurrent run?)"
              echo ">>> [Core Oracle] Initial tag $NEW_TAG pushed!"
            fi
            exit 0
          fi

          mkdir -p abi_workspace/current abi_workspace/old

          # Build CURRENT code.
          # The esp32c6 template is used as a reference target. Core libraries
          # are chip-independent — the ABI output is identical for any chip.
          echo ">>> Building CURRENT Code..."
          toob build --native --manifest toob-registry/chips/esp32c6/template_device.toml

          for lib in libtoob_core.a libtoob_libtoob.a libtoob_zcbor.a libtoob_heatshrink.a; do
            find . -path '*/builds/*' -name "$lib" -exec cp {} abi_workspace/current/ \;
          done
          find . -path '*/builds/build_*' -type d -exec rm -rf {} + 2>/dev/null || true

          # Build OLD code using git worktree (faster than clone, shares object store)
          echo ">>> Building OLD Code from $LAST_TAG..."
          git worktree add abi_workspace/old_repo "$LAST_TAG" 2>/dev/null || {
            echo ">>> [FATAL] Cannot create worktree for $LAST_TAG"
            exit 1
          }
          cd abi_workspace/old_repo
          git submodule update --init toob-registry

          toob build --native --manifest toob-registry/chips/esp32c6/template_device.toml || {
            echo ">>> [FATAL] Old build failed. Cannot produce ABI baseline."
            cd ../../
            git worktree remove abi_workspace/old_repo --force 2>/dev/null || true
            exit 1
          }

          for lib in libtoob_core.a libtoob_libtoob.a libtoob_zcbor.a libtoob_heatshrink.a; do
            find . -path '*/builds/*' -name "$lib" -exec cp {} ../old/ \;
          done
          cd ../../
          git worktree remove abi_workspace/old_repo --force 2>/dev/null || true

          # Symbol-based ABI diff using the cross-compiler's nm.
          # This avoids abidiff's crash on cross-compiled RISC-V ELF files.
          # Extract public symbols (T=text, D=data, B=bss) and compare sets.
          echo ">>> Running symbol-based ABI diff..."

          # Locate the cross-compiler nm (installed during build)
          NM_BIN=$(find ~/.toob/toolchains -name "riscv32-esp-elf-nm" 2>/dev/null | head -1)
          if [ -z "$NM_BIN" ]; then
            NM_BIN="nm"  # fallback to host nm
          fi
          echo ">>> Using nm: $NM_BIN"

          BUMP="PATCH"

          for lib in libtoob_core.a libtoob_libtoob.a libtoob_zcbor.a libtoob_heatshrink.a; do
            OLD_LIB="abi_workspace/old/$lib"
            NEW_LIB="abi_workspace/current/$lib"

            if [ ! -f "$OLD_LIB" ] || [ ! -f "$NEW_LIB" ]; then
              continue
            fi

            # Extract globally-visible defined symbols (type + name)
            $NM_BIN --defined-only -g "$OLD_LIB" 2>/dev/null | awk '{print $2, $3}' | sort -u > /tmp/sym_old.txt
            $NM_BIN --defined-only -g "$NEW_LIB" 2>/dev/null | awk '{print $2, $3}' | sort -u > /tmp/sym_new.txt

            REMOVED=$(comm -23 /tmp/sym_old.txt /tmp/sym_new.txt | wc -l)
            ADDED=$(comm -13 /tmp/sym_old.txt /tmp/sym_new.txt | wc -l)

            if [ "$REMOVED" -gt 0 ]; then
              echo ">>> [RESULT] $lib: $REMOVED symbols REMOVED (MAJOR)"
              comm -23 /tmp/sym_old.txt /tmp/sym_new.txt | head -10
              BUMP="MAJOR"
            elif [ "$ADDED" -gt 0 ] && [ "$BUMP" != "MAJOR" ]; then
              echo ">>> [RESULT] $lib: $ADDED symbols ADDED (MINOR)"
              comm -13 /tmp/sym_old.txt /tmp/sym_new.txt | head -10
              [ "$BUMP" = "PATCH" ] && BUMP="MINOR"
            else
              echo ">>> [RESULT] $lib: No symbol changes"
            fi
          done

          # Layer 2: Public header diff to catch struct/typedef/enum changes
          # that are invisible to nm (same symbol name, different layout).
          echo ">>> Running public header analysis..."
          HEADER_DIRS="toobloader/core/include sdk/libtoob/include sdk/os_client/include common/include"

          for hdir in $HEADER_DIRS; do
            [ ! -d "$hdir" ] && continue

            DELETED_H=$(git diff --diff-filter=D --name-only "$LAST_TAG" HEAD -- "$hdir" 2>/dev/null | wc -l)
            ADDED_H=$(git diff --diff-filter=A --name-only "$LAST_TAG" HEAD -- "$hdir" 2>/dev/null | wc -l)
            MODIFIED_H=$(git diff --diff-filter=M --name-only "$LAST_TAG" HEAD -- "$hdir" 2>/dev/null || echo "")

            # Deleted public headers = breaking
            if [ "$DELETED_H" -gt 0 ]; then
              echo ">>> [HEADER] $hdir: $DELETED_H headers DELETED (MAJOR)"
              BUMP="MAJOR"
            fi

            # New public headers = new capability
            if [ "$ADDED_H" -gt 0 ] && [ "$BUMP" != "MAJOR" ]; then
              echo ">>> [HEADER] $hdir: $ADDED_H new headers (MINOR)"
              [ "$BUMP" = "PATCH" ] && BUMP="MINOR"
            fi

            # Modified headers: check if struct/typedef/enum definitions changed
            if [ -n "$MODIFIED_H" ] && [ "$BUMP" != "MAJOR" ]; then
              for hfile in $MODIFIED_H; do
                # Extract struct, typedef, and enum lines from old and new
                OLD_DEFS=$(git show "${LAST_TAG}:${hfile}" 2>/dev/null | grep -E '^\s*(typedef\s|struct\s|enum\s|}\s*\w+)' | sort)
                NEW_DEFS=$(cat "$hfile" 2>/dev/null | grep -E '^\s*(typedef\s|struct\s|enum\s|}\s*\w+)' | sort)

                if [ "$OLD_DEFS" != "$NEW_DEFS" ]; then
                  echo ">>> [HEADER] $hfile: type definitions changed (MINOR)"
                  [ "$BUMP" = "PATCH" ] && BUMP="MINOR"
                fi
              done
            fi
          done

          echo ">>> [Core Oracle] Final bump type: $BUMP"

          case "$BUMP" in
            MAJOR) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            MINOR) MINOR=$((MINOR + 1)); PATCH=0 ;;
            PATCH) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="core/v${MAJOR}.${MINOR}.${PATCH}"
          echo ">>> [Core Oracle] Calculated new version: $NEW_TAG"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [Core Oracle] Tag $NEW_TAG already exists. Skipping."
          else
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG" || echo ">>> Tag push failed (concurrent run?)"
              echo ">>> [Core Oracle] Tag $NEW_TAG pushed!"
          fi

      - name: ABI Orakel (CLI)
        if: env.CHECK_CLI == 'true'
        run: |
          echo ">>> [CLI Oracle] Starting Contract analysis for CLI..."

          LAST_TAG=$(git describe --tags --match "cli/v*" --abbrev=0 2>/dev/null || echo "cli/v0.0.0")
          RAW_VERSION=${LAST_TAG#cli/v}
          echo ">>> [CLI Oracle] Baseline Tag: $LAST_TAG"

          MAJOR=$(echo $RAW_VERSION | cut -d. -f1)
          MINOR=$(echo $RAW_VERSION | cut -d. -f2)
          PATCH=$(echo $RAW_VERSION | cut -d. -f3)

          mkdir -p cli_abi_workspace
          cp cli/toob-cli/internal/ports/ports.go cli_abi_workspace/ports_current.go

          if [ "$LAST_TAG" != "cli/v0.0.0" ]; then
              git show $LAST_TAG:cli/toob-cli/internal/ports/ports.go > cli_abi_workspace/ports_old.go 2>/dev/null || touch cli_abi_workspace/ports_old.go
          else
              touch cli_abi_workspace/ports_old.go
          fi

          echo ">>> Running AST-based Contract Differ..."
          cd cli/toob-cli
          go build -o /tmp/semver-tool ./internal/ports/cmd/semver
          BUMP_TYPE=$(/tmp/semver-tool ../../cli_abi_workspace/ports_old.go ../../cli_abi_workspace/ports_current.go | tail -n 1)
          cd ../../
          echo ">>> [RESULT] Contract Differ determined bump type: $BUMP_TYPE"

          if [ "$BUMP_TYPE" = "MAJOR" ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP_TYPE" = "MINOR" ]; then
              MINOR=$((MINOR + 1)); PATCH=0
          else
              PATCH=$((PATCH + 1))
          fi

          NEW_TAG="cli/v${MAJOR}.${MINOR}.${PATCH}"
          echo ">>> [CLI Oracle] Calculated new version: $NEW_TAG"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [CLI Oracle] Tag $NEW_TAG already exists. Skipping."
          else
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG" || echo ">>> Tag push failed (concurrent run?)"
              echo ">>> [CLI Oracle] Tag $NEW_TAG pushed!"
          fi

      - name: ABI Orakel (Compiler Container)
        if: env.CHECK_COMPILER == 'true'
        run: |
          echo ">>> [Compiler Oracle] Starting manifest-based version analysis..."

          LAST_TAG=$(git describe --tags --match "compiler/v*" --abbrev=0 2>/dev/null || echo "compiler/v0.0.0")
          echo ">>> [Compiler Oracle] Baseline Tag: $LAST_TAG"

          CURRENT_VERSION=$(jq -r '.compiler_version' compiler/compiler_manifest.json)
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

          BUMP="PATCH"
          if [ "$LAST_TAG" != "compiler/v0.0.0" ]; then
              OLD_MANIFEST=$(git show $LAST_TAG:compiler/compiler_manifest.json 2>/dev/null || echo '{}')

              OLD_PROTOCOL=$(echo "$OLD_MANIFEST" | jq -r '.protocol_version // 0')
              NEW_PROTOCOL=$(jq -r '.protocol_version' compiler/compiler_manifest.json)
              if [ "$OLD_PROTOCOL" != "$NEW_PROTOCOL" ]; then
                  BUMP="MAJOR"
              fi

              if [ "$BUMP" = "PATCH" ]; then
                  OLD_BASE=$(echo "$OLD_MANIFEST" | jq -r '.base_image.image // ""')
                  NEW_BASE=$(jq -r '.base_image.image' compiler/compiler_manifest.json)
                  OLD_SYSPKG=$(echo "$OLD_MANIFEST" | jq -cS '.system_packages // []')
                  NEW_SYSPKG=$(jq -cS '.system_packages' compiler/compiler_manifest.json)
                  if [ "$OLD_BASE" != "$NEW_BASE" ] || [ "$OLD_SYSPKG" != "$NEW_SYSPKG" ]; then
                      BUMP="MINOR"
                  fi
              fi
          fi

          echo ">>> [Compiler Oracle] Bump type: $BUMP"

          if [ "$BUMP" = "MAJOR" ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "MINOR" ]; then
              MINOR=$((MINOR + 1)); PATCH=0
          else
              PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="compiler/v${NEW_VERSION}"
          echo ">>> [Compiler Oracle] New version: $NEW_TAG"

          # Check tag existence BEFORE writing to manifest to prevent double-bumps
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [Compiler Oracle] Tag $NEW_TAG already exists. Skipping."
              exit 0
          fi

          # Update version in manifest and commit
          jq --arg v "$NEW_VERSION" '.compiler_version = $v' \
            compiler/compiler_manifest.json > tmp_manifest.json \
            && mv tmp_manifest.json compiler/compiler_manifest.json

          git add compiler/compiler_manifest.json
          git commit -m "chore(compiler): bump to v${NEW_VERSION} [skip ci]" || true

          # Atomic push: commit + tag together to prevent race conditions
          git tag "$NEW_TAG"
          git push origin HEAD:main "$NEW_TAG" || echo ">>> Push failed (concurrent run?)"
          echo ">>> [Compiler Oracle] Tag $NEW_TAG pushed!"

          # Create draft release as manual approval gate
          CLI_VER=$(jq -r '.cli.version' compiler/compiler_manifest.json)
          PROTO_VER=$(jq -r '.protocol_version' compiler/compiler_manifest.json)
          BODY="## Compiler v${NEW_VERSION}\n\n"
          BODY+="| Property | Value |\n|---|---|\n"
          BODY+="| CLI | v${CLI_VER} |\n"
          BODY+="| Protocol | v${PROTO_VER} |\n\n"
          BODY+="**Publish this release to trigger the Docker image build on the CI server.**"

          curl -sf -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RELEASE_TARGET_TOKEN }}" \
            https://api.github.com/repos/Toob-Boot/Toob-Loader/releases \
            -d "{
              \"tag_name\": \"${NEW_TAG}\",
              \"name\": \"Compiler v${NEW_VERSION}\",
              \"body\": \"$(echo -e "$BODY")\",
              \"draft\": true,
              \"prerelease\": false
            }" && echo ">>> [Compiler Oracle] Draft release created for ${NEW_TAG}" \
               || echo ">>> [Compiler Oracle] Draft creation failed (non-critical)"

      - name: ABI Orakel (Chips)
        if: env.CHECK_CHIPS == 'true'
        run: |
          echo ">>> [Chips Oracle] Analyzing chip changes with dependency inheritance..."
          REPO_ROOT=$(pwd)

          OLD_SUB=${{ env.CHIPS_OLD_SUB }}
          NEW_SUB=${{ env.CHIPS_NEW_SUB }}

          # Bump priority: MAJOR(3) > MINOR(2) > PATCH(1) > NONE(0)
          bump_rank() {
            case "$1" in
              MAJOR) echo 3 ;; MINOR) echo 2 ;; PATCH) echo 1 ;; *) echo 0 ;;
            esac
          }

          # Compute bump type for a submodule directory diff
          compute_dir_bump() {
            local dir_path=$1
            local bump="PATCH"
            if [ -n "$OLD_SUB" ] && [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
              local del_h=$(cd toob-registry && git diff --diff-filter=D --name-only "$OLD_SUB" "$NEW_SUB" -- "${dir_path}/" 2>/dev/null | grep -c '\.h$' || true)
              local add=$(cd toob-registry && git diff --diff-filter=A --name-only "$OLD_SUB" "$NEW_SUB" -- "${dir_path}/" 2>/dev/null | wc -l)
              cd "$REPO_ROOT"
              if [ "$del_h" -gt 0 ]; then bump="MAJOR"
              elif [ "$add" -gt 0 ]; then bump="MINOR"; fi
            fi
            echo "$bump"
          }

          for chip_dir in toob-registry/chips/*/; do
            chip=$(basename "$chip_dir")
            [ ! -f "${chip_dir}/chip_manifest.json" ] && continue

            # Read this chip's dependency references
            chip_arch=$(jq -r '.arch // ""' "${chip_dir}/chip_manifest.json")
            chip_vendor=$(jq -r '.vendor // ""' "${chip_dir}/chip_manifest.json")

            # Check for changes in chip's own directory
            CHIP_CHANGES=""
            if [ -n "$OLD_SUB" ] && [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
              CHIP_CHANGES=$(cd toob-registry && git diff --name-only "$OLD_SUB" "$NEW_SUB" -- "chips/${chip}/" 2>/dev/null || echo "")
              cd "$REPO_ROOT"
            fi

            # Check for changes in this chip's dependencies
            ARCH_DEP_CHANGES=""
            if [ -n "$chip_arch" ] && [ -n "$OLD_SUB" ] && [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
              ARCH_DEP_CHANGES=$(cd toob-registry && git diff --name-only "$OLD_SUB" "$NEW_SUB" -- "arch/${chip_arch}/" 2>/dev/null || echo "")
              cd "$REPO_ROOT"
            fi

            VENDOR_DEP_CHANGES=""
            if [ -n "$chip_vendor" ] && [ -n "$OLD_SUB" ] && [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
              VENDOR_DEP_CHANGES=$(cd toob-registry && git diff --name-only "$OLD_SUB" "$NEW_SUB" -- "vendor/${chip_vendor}/" 2>/dev/null || echo "")
              cd "$REPO_ROOT"
            fi

            # Skip chip only if neither own files nor any dependency changed
            [ -z "$CHIP_CHANGES" ] && [ -z "$ARCH_DEP_CHANGES" ] && [ -z "$VENDOR_DEP_CHANGES" ] && continue

            echo ">>> [Chips Oracle] ${chip}: Changes detected"
            [ -n "$CHIP_CHANGES" ] && echo "  Own: $CHIP_CHANGES"
            [ -n "$ARCH_DEP_CHANGES" ] && echo "  Arch (${chip_arch}): $ARCH_DEP_CHANGES"
            [ -n "$VENDOR_DEP_CHANGES" ] && echo "  Vendor (${chip_vendor}): $VENDOR_DEP_CHANGES"

            LAST_TAG=$(git describe --tags --match "chip-${chip}/v*" --abbrev=0 2>/dev/null || echo "")

            if [ -z "$LAST_TAG" ]; then
              NEW_VERSION=$(jq -r '.version' "${chip_dir}/chip_manifest.json")
            else
              RAW=${LAST_TAG#chip-${chip}/v}
              MAJOR=$(echo "$RAW" | cut -d. -f1)
              MINOR=$(echo "$RAW" | cut -d. -f2)
              PATCH=$(echo "$RAW" | cut -d. -f3)

              # Own bump from chip-local changes
              OWN_BUMP="NONE"
              if [ -n "$CHIP_CHANGES" ]; then
                OWN_BUMP="PATCH"

                # Breaking: arch, vendor, or compiler_prefix reference changed in manifest
                OLD_M=$(cd toob-registry && git show "${OLD_SUB}:chips/${chip}/chip_manifest.json" 2>/dev/null || echo '{}')
                cd "$REPO_ROOT"
                for field in arch vendor compiler_prefix; do
                  OLD_VAL=$(echo "$OLD_M" | jq -r ".${field} // \"\"")
                  NEW_VAL=$(jq -r ".${field}" "${chip_dir}/chip_manifest.json")
                  if [ "$OLD_VAL" != "$NEW_VAL" ]; then
                    OWN_BUMP="MAJOR"
                    break
                  fi
                done

                # Structural: deleted headers = MAJOR, new files = MINOR
                if [ "$OWN_BUMP" != "MAJOR" ]; then
                  OWN_BUMP=$(compute_dir_bump "chips/${chip}")
                fi
              fi

              # Inherited bump from arch dependency
              ARCH_BUMP="NONE"
              if [ -n "$ARCH_DEP_CHANGES" ]; then
                ARCH_BUMP=$(compute_dir_bump "arch/${chip_arch}")
                echo ">>> [Chips Oracle] ${chip}: inherited arch bump = $ARCH_BUMP"
              fi

              # Inherited bump from vendor dependency
              VENDOR_BUMP="NONE"
              if [ -n "$VENDOR_DEP_CHANGES" ]; then
                VENDOR_BUMP=$(compute_dir_bump "vendor/${chip_vendor}")
                echo ">>> [Chips Oracle] ${chip}: inherited vendor bump = $VENDOR_BUMP"
              fi

              # Final bump = max(own, arch, vendor)
              BUMP="$OWN_BUMP"
              for dep_bump in $ARCH_BUMP $VENDOR_BUMP; do
                if [ $(bump_rank "$dep_bump") -gt $(bump_rank "$BUMP") ]; then
                  BUMP="$dep_bump"
                fi
              done

              # Ensure at least PATCH if any change was detected
              [ "$BUMP" = "NONE" ] && BUMP="PATCH"

              echo ">>> [Chips Oracle] ${chip}: own=$OWN_BUMP arch=$ARCH_BUMP vendor=$VENDOR_BUMP → final=$BUMP"
              case "$BUMP" in
                MAJOR) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
                MINOR) MINOR=$((MINOR+1)); PATCH=0 ;;
                PATCH) PATCH=$((PATCH+1)) ;;
              esac
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi

            NEW_TAG="chip-${chip}/v${NEW_VERSION}"
            if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [Chips Oracle] Tag ${NEW_TAG} exists. Skipping."
              continue
            fi

            git tag "$NEW_TAG"
            git push origin "$NEW_TAG" || echo ">>> Tag push failed (concurrent run?)"
            echo ">>> [Chips Oracle] Pushed ${NEW_TAG}"
          done

      - name: ABI Orakel (Architectures)
        if: env.CHECK_ARCH == 'true'
        run: |
          echo ">>> [Arch Oracle] Analyzing architecture changes..."
          REPO_ROOT=$(pwd)

          # Use references safely exported during the detection phase
          OLD_SUB=${{ env.ARCH_OLD_SUB }}
          NEW_SUB=${{ env.ARCH_NEW_SUB }}

          for arch_dir in toob-registry/arch/*/; do
            arch=$(basename "$arch_dir")
            [ ! -f "${arch_dir}/arch_manifest.json" ] && continue

            ARCH_CHANGES=""
            if [ -n "$OLD_SUB" ] && [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
              ARCH_CHANGES=$(cd toob-registry && git diff --name-only "$OLD_SUB" "$NEW_SUB" -- "arch/${arch}/" 2>/dev/null || echo "")
              cd "$REPO_ROOT"
            fi
            [ -z "$ARCH_CHANGES" ] && continue

            echo ">>> [Arch Oracle] ${arch}: Changes detected"
            echo "$ARCH_CHANGES"

            LAST_TAG=$(git describe --tags --match "arch-${arch}/v*" --abbrev=0 2>/dev/null || echo "")

            if [ -z "$LAST_TAG" ]; then
              NEW_VERSION=$(jq -r '.version' "${arch_dir}/arch_manifest.json")
            else
              RAW=${LAST_TAG#arch-${arch}/v}
              MAJOR=$(echo "$RAW" | cut -d. -f1)
              MINOR=$(echo "$RAW" | cut -d. -f2)
              PATCH=$(echo "$RAW" | cut -d. -f3)

              BUMP="PATCH"

              DEL_H=$(cd toob-registry && git diff --diff-filter=D --name-only "$OLD_SUB" "$NEW_SUB" -- "arch/${arch}/" 2>/dev/null | grep -c '\.h$' || true)
              ADD=$(cd toob-registry && git diff --diff-filter=A --name-only "$OLD_SUB" "$NEW_SUB" -- "arch/${arch}/" 2>/dev/null | wc -l)
              cd "$REPO_ROOT"

              if [ "$DEL_H" -gt 0 ]; then BUMP="MAJOR"
              elif [ "$ADD" -gt 0 ]; then BUMP="MINOR"; fi

              echo ">>> [Arch Oracle] ${arch}: Bump=$BUMP"
              case "$BUMP" in
                MAJOR) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
                MINOR) MINOR=$((MINOR+1)); PATCH=0 ;;
                PATCH) PATCH=$((PATCH+1)) ;;
              esac
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi

            NEW_TAG="arch-${arch}/v${NEW_VERSION}"
            if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [Arch Oracle] Tag ${NEW_TAG} exists. Skipping."
              continue
            fi

            git tag "$NEW_TAG"
            git push origin "$NEW_TAG" || echo ">>> Tag push failed (concurrent run?)"
            echo ">>> [Arch Oracle] Pushed ${NEW_TAG}"
          done

      - name: ABI Orakel (Vendors)
        if: env.CHECK_VENDORS == 'true'
        run: |
          echo ">>> [Vendors Oracle] Analyzing vendor changes..."
          REPO_ROOT=$(pwd)

          OLD_SUB=${{ env.VENDOR_OLD_SUB }}
          NEW_SUB=${{ env.VENDOR_NEW_SUB }}

          for vendor_dir in toob-registry/vendor/*/; do
            vendor=$(basename "$vendor_dir")
            [ ! -f "${vendor_dir}/vendor_manifest.json" ] && continue

            VENDOR_CHANGES=""
            if [ -n "$OLD_SUB" ] && [ -n "$NEW_SUB" ] && [ "$OLD_SUB" != "$NEW_SUB" ]; then
              VENDOR_CHANGES=$(cd toob-registry && git diff --name-only "$OLD_SUB" "$NEW_SUB" -- "vendor/${vendor}/" 2>/dev/null || echo "")
              cd "$REPO_ROOT"
            fi
            [ -z "$VENDOR_CHANGES" ] && continue

            echo ">>> [Vendors Oracle] ${vendor}: Changes detected"
            echo "$VENDOR_CHANGES"

            LAST_TAG=$(git describe --tags --match "vendor-${vendor}/v*" --abbrev=0 2>/dev/null || echo "")

            if [ -z "$LAST_TAG" ]; then
              NEW_VERSION=$(jq -r '.version' "${vendor_dir}/vendor_manifest.json")
            else
              RAW=${LAST_TAG#vendor-${vendor}/v}
              MAJOR=$(echo "$RAW" | cut -d. -f1)
              MINOR=$(echo "$RAW" | cut -d. -f2)
              PATCH=$(echo "$RAW" | cut -d. -f3)

              BUMP="PATCH"

              DEL_H=$(cd toob-registry && git diff --diff-filter=D --name-only "$OLD_SUB" "$NEW_SUB" -- "vendor/${vendor}/" 2>/dev/null | grep -c '\.h$' || true)
              ADD=$(cd toob-registry && git diff --diff-filter=A --name-only "$OLD_SUB" "$NEW_SUB" -- "vendor/${vendor}/" 2>/dev/null | wc -l)
              cd "$REPO_ROOT"

              if [ "$DEL_H" -gt 0 ]; then BUMP="MAJOR"
              elif [ "$ADD" -gt 0 ]; then BUMP="MINOR"; fi

              echo ">>> [Vendors Oracle] ${vendor}: Bump=$BUMP"
              case "$BUMP" in
                MAJOR) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
                MINOR) MINOR=$((MINOR+1)); PATCH=0 ;;
                PATCH) PATCH=$((PATCH+1)) ;;
              esac
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi

            NEW_TAG="vendor-${vendor}/v${NEW_VERSION}"
            if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo ">>> [Vendors Oracle] Tag ${NEW_TAG} exists. Skipping."
              continue
            fi

            git tag "$NEW_TAG"
            git push origin "$NEW_TAG" || echo ">>> Tag push failed (concurrent run?)"
            echo ">>> [Vendors Oracle] Pushed ${NEW_TAG}"
          done
