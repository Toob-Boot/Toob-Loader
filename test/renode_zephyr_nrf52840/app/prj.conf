# Toob-Boot Wave 4C Zephyr RTOS + sdk/os_client Configuration (nRF52840)

# Bootloader & 256-byte Cortex-M4F SCB->VTOR alignment (0x00038000 + 0x100)
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_ROM_START_OFFSET=0x100
CONFIG_BUILD_OUTPUT_BIN=y

# Headless UART console (no J-Link SEGGER RTT module needed)
CONFIG_USE_SEGGER_RTT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Preemptive multi-threading & warm system reboot support
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
CONFIG_REBOOT=y

# 32.768 kHz internal RC clock for deterministic Renode emulation
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n

# Internal NVMC Flash, ARM MPU Flash write access, and persistent NVS KV store
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y

# Hardware RNG + Modern Zephyr PSA Crypto SHA-256 (replaces removed TinyCrypt)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# Toob-Boot Zephyr RTOS Integration (v1.2.0) & sdk/os_client
CONFIG_TOOB_INTEGRATION=y
CONFIG_TOOB_BUILD_LIBTOOB=y
CONFIG_TOOB_SHA256_PSA=y
CONFIG_TOOB_NVS_ZEPHYR_NVS=y
CONFIG_TOOB_CONFIRM_RTC_ENABLE=y
CONFIG_TOOB_NETWORK_CLIENT=y
