name: Notify Toob-Loader on Publish

# Fires when a draft release is published or a new release is created.
# Sends a repository_dispatch to Toob-Loader so the compiler manifest
# is updated only after the CLI binaries are publicly downloadable.
on:
  release:
    types: [published]

jobs:
  notify:
    name: Dispatch to Toob-Loader
    runs-on: ubuntu-latest
    steps:
      - name: Send CLI Published Event
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo ">>> Dispatching cli_published event for ${TAG}..."

          curl -sf -X POST \
            https://api.github.com/repos/Toob-Boot/Toob-Loader/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RELEASE_TARGET_TOKEN }}" \
            -d "{\"event_type\": \"cli_published\", \"client_payload\": {\"version\": \"${TAG}\"}}"

          echo ">>> [SUCCESS] Dispatched to Toob-Loader."
